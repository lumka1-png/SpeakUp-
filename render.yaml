# One-click setup for the SpeakUp! API on Render (https://render.com).
# In Render: New > Blueprint, choose this repository, then fill in the values marked "sync: false".
services:
  - type: web
    name: speakup-api
    runtime: node
    rootDir: server
    # A paid plan is needed for the disk below, which keeps podcast audio and word reports.
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SPEAKUP_CLAUDE_KEY
        sync: false
      - key: SPEAKUP_OPENAI_KEY
        sync: false
      # The web address of the app, for example https://app.yourwebsite.com
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
      - key: AUDIO_DIR
        value: /var/data/audio
      - key: REPORTS_FILE
        value: /var/data/reports.jsonl
    disk:
      name: speakup-data
      mountPath: /var/data
      sizeGB: 1
